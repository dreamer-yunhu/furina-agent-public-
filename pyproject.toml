[project]
name = "furina-agent-workspace"
version = "0.1.0"
requires-python = ">=3.12"
# 工作区根不承载业务依赖：真正跑服务的是 apps/web 与 apps/desktop。
# 共享代码在 packages/core —— 这是 web 与 desktop 唯一允许共同依赖的东西。
dependencies = [
    "uvicorn==0.50.2",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true


[dependency-groups]
# T4：把后端打成 exe 用的构建工具（不是运行时依赖）
dev = ["pyinstaller>=6.22", "pytest>=8.3"]
