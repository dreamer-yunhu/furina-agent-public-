[project]
name = "furina-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.139.0",
    "langgraph>=1.2.11",
    "openai>=1.0.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=8.0.1",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "uvicorn==0.50.2",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
